proxy_cache_path /tmp/cache levels=1:2 keys_zone=cache:10m max_size=500m inactive=60m use_temp_path=off;
upstream frontend {
    server vue:8080;
}

upstream backend {
    server fastapi:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name 3americastax.center;

    # Necessary for Certbot domain validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }

    location /api {
      proxy_pass http://backend;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      
    }

}

server {
    listen 443 ssl;
    server_name 3americastax.center;

    # SSL Certificate Paths
    ssl_certificate /etc/letsencrypt/live/3americastax.center/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/3americastax.center/privkey.pem;

    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Copy your API location block here if you want it protected by HTTPS
    location /api {
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://backend;
    }
}