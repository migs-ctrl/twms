services:
  nginx:
    build: nginx
    container_name: nginx
    ports:
      - 80:80
      - 443:443
    depends_on:
      - vue
      - fastapi
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    networks:
      - app-network
  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"  # Renew certificates every 12 hours
  fastapi:
    build: api
    container_name: fastapi
    restart: "no"
    networks:
      - app-network
  vue:
    build: frontend
    container_name: vue
    environment: 
      PORT: 3000
    networks:
      - app-network
volumes:
  certbot-etc:
  certbot-var:
networks:
  app-network:
    driver: bridge